# Replace assets.example.com and certificate paths before enabling.
server {
    listen 80;
    server_name assets.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name assets.example.com;
    ssl_certificate /etc/letsencrypt/live/assets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.example.com/privkey.pem;
    client_max_body_size 21m;
    root /opt/asset-system/frontend;
    index index.html;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
